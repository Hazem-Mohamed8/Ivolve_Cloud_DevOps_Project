apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolve-config
  namespace: {{ .Values.namespace }}
data:
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
  AUTH_SERVICE_URL: {{ printf "http://%s:%v" .Values.services.auth.name .Values.services.auth.port | quote }}
  ROADMAP_SERVICE_URL: {{ printf "http://%s:%v" .Values.services.roadmap.name .Values.services.roadmap.port | quote }}
