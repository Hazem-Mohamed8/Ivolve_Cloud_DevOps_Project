name: CI Template (shared library)

on:
  workflow_call:
    inputs:
      service:
        description: Folder and ECR repo name (frontend / auth-service / roadmap-service)
        required: true
        type: string
      tag_key:
        description: Key under tags in helm/ivolve/values.yaml (frontend / auth / roadmap)
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: eu-north-1
  ECR_NAMESPACE: ivolve

jobs:
  ci:
    runs-on: [self-hosted, ivolve]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        run: echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ inputs.service }}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Image
        run: docker build --pull -t "$IMAGE" ./${{ inputs.service }}

      - name: Scan Image (Trivy)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Push Image
        run: docker push "$IMAGE"

      - name: Delete Image Locally
        if: always()
        run: docker rmi "$IMAGE" || true

      - name: Update Manifests
        env:
          KEY: ${{ inputs.tag_key }}
        run: |
          TAG="${GITHUB_SHA::7}"
          sed -i -E "s|^  ${KEY}: .*|  ${KEY}: '${TAG}'|" helm/ivolve/values.yaml
          git diff -- helm/ivolve/values.yaml

      - name: Push Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/ivolve/values.yaml
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "ci(${{ inputs.service }}): image ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Post - success
        if: success()
        run: echo "Pipeline for ${{ inputs.service }} finished successfully"

      - name: Post - failure
        if: failure()
        run: echo "Pipeline for ${{ inputs.service }} FAILED"
